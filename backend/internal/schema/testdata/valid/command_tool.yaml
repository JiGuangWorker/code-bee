version: "1"
name: command-tool
description: 验证 command 类型工具必填 run 字段
tools:
  - name: lint
    type: command
    run: "golangci-lint run ./..."
    timeout: 120s
  - name: coder
    type: agent
    skill: "开发者Skill/SKILL.md"
    prompt_template: coding
pipeline:
  - stage:
      name: lint
      tool: lint
  - stage:
      name: coding
      tool: coder
