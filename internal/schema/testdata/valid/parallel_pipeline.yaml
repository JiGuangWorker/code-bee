version: "1"
name: parallel-pipeline
description: 验证 parallel 原语至少 2 个子步骤
tools:
  - name: lint
    type: command
    run: "golangci-lint run ./..."
  - name: test
    type: command
    run: "go test ./..."
  - name: coder
    type: agent
    skill: "开发者Skill/SKILL.md"
    prompt_template: coding
pipeline:
  - parallel:
      - stage:
          name: lint
          tool: lint
      - stage:
          name: test
          tool: test
  - stage:
      name: coding
      tool: coder
